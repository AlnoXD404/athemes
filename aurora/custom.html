<!-- =============================================================
  AURORA — Premium Glassmorphism Theme for Pterodactyl Panel 1.x
  -------------------------------------------------------------
  Paste this file into:  Admin Panel → Settings → Theme
  → "Custom HTML" input box.

  Adds:
    • Premium Google Fonts (Outfit + Inter + JetBrains Mono)
    • Animated floating background glow orbs
    • A subtle "glow" helper that tints primary buttons
    • Keeps everything optional — the panel works without it.
  ============================================================= -->

<!-- 1. Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- 2. Background glow orbs -->
<div class="aurora-bg" aria-hidden="true">
  <div class="aurora-orb aurora-orb--purple"></div>
  <div class="aurora-orb aurora-orb--blue"></div>
  <div class="aurora-orb aurora-orb--cyan"></div>
</div>

<style>
  .aurora-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .aurora-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.5;
    will-change: transform;
  }
  .aurora-orb--purple {
    width: 480px;
    height: 480px;
    top: -140px;
    left: -120px;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.55), transparent 70%);
    animation: aurora-float 22s ease-in-out infinite alternate;
  }
  .aurora-orb--blue {
    width: 520px;
    height: 520px;
    top: 30%;
    right: -180px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.5), transparent 70%);
    animation: aurora-float 26s ease-in-out infinite alternate-reverse;
  }
  .aurora-orb--cyan {
    width: 420px;
    height: 420px;
    bottom: -160px;
    left: 35%;
    background: radial-gradient(circle, rgba(34, 211, 238, 0.35), transparent 70%);
    animation: aurora-float 30s ease-in-out infinite alternate;
  }
  @keyframes aurora-float {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(60px, 40px) scale(1.12); }
    100% { transform: translate(-50px, -30px) scale(0.95); }
  }
</style>

<!-- 3. UI polish -->
<script>
  (function () {
    'use strict';

    // Keep animated orbs on every page (SPA-safe enough for the panel).
    if (window.auroraInjected) return;
    window.auroraInjected = true;

    // Add a "Copy" button to monospace server/console snippets if present.
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.copyable').forEach(function (el) {
        if (el.dataset.auroraCopy) return;
        el.dataset.auroraCopy = '1';
        var btn = document.createElement('button');
        btn.className = 'btn btn-sm btn-secondary';
        btn.textContent = 'Copy';
        btn.style.cssText = 'margin-top:8px;font-size:12px;';
        btn.addEventListener('click', function () {
          var text = el.textContent.trim();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
              btn.textContent = 'Copied!';
              setTimeout(function () { btn.textContent = 'Copy'; }, 1600);
            });
          }
        });
        el.after(btn);
      });
    });
  })();
</script>
